name: Generate Snake

on:
  schedule:
    # tiap 12 jam, biar SVG-nya ngikutin kotak kontribusi terbaru
    - cron: "0 */12 * * *"
  workflow_dispatch: # bisa dijalanin manual dari tab Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Bikin SVG ular
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push hasilnya ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
